<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WLC OmniRetail SaaS — Gestão Omnichannel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { bg: { app: '#09090b', surface: '#18181b' }, primary: '#3b82f6' } } } }
  </script>
</head>
<body class="bg-bg-app text-zinc-100 min-h-dvh flex font-sans">
  <aside class="w-64 border-r border-zinc-800 bg-zinc-950 p-4 space-y-6 flex flex-col">
    <div class="flex items-center gap-2 px-2 py-1">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white">OR</div>
      <div>
        <div class="font-bold text-sm leading-tight text-white">OmniRetail</div>
        <div class="text-xs text-zinc-400">SaaS Platform</div>
      </div>
    </div>
    
    <nav class="space-y-1 flex-1">
      <a href="#dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-zinc-300 hover:bg-zinc-900 hover:text-white transition">
        <span>Dashboard</span>
      </a>
      <a href="#pdv" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-zinc-300 hover:bg-zinc-900 hover:text-white transition">
        <span>PDV (Caixa)</span>
      </a>
      <a href="#estoque" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-zinc-300 hover:bg-zinc-900 hover:text-white transition">
        <span>Estoque & Produtos</span>
      </a>
      <a href="#funil" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-zinc-300 hover:bg-zinc-900 hover:text-white transition">
        <span>Funil de Vendas</span>
      </a>
    </nav>

    <div class="pt-4 border-t border-zinc-800 text-xs text-zinc-500">
      WLC.IA Core v1.0 • v1.0.0
    </div>
  </aside>

  <main id="app" class="flex-1 p-8 overflow-y-auto max-h-dvh">
    <div class="view-pane" data-view="dashboard"></div>
    <div class="view-pane" data-view="pdv"></div>
    <div class="view-pane" data-view="estoque"></div>
    <div class="view-pane" data-view="funil"></div>
  </main>

  <script type="module" src="js/core/router.js"></script>
</body>
</html>
